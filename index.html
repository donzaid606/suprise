<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sofia... This Is For You 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fde4ea; --bg2:#f7d0da; --rose:#c2185b; --deep:#8b1230; --ink:#7a1038;
  --btn1:#e0366b; --btn2:#b8164a; --card:#fffdfc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 20% 10%,#fff1f4 0,transparent 45%),
             radial-gradient(circle at 85% 90%,#f9c4d2 0,transparent 50%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
}
#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floater{position:absolute;bottom:-60px;opacity:0;animation:rise linear forwards;filter:drop-shadow(0 4px 6px rgba(194,24,91,.2))}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.85}90%{opacity:.7}100%{transform:translateY(-115vh) rotate(40deg);opacity:0}}

.screen{
  position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  text-align:center;opacity:0;visibility:hidden;transform:translateY(18px) scale(.98);
  transition:opacity .7s ease,transform .7s ease,visibility .7s;overflow-y:auto;
}
.screen.active{opacity:1;visibility:visible;transform:none}
.inner{width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;align-items:center}

h1,h2{font-family:'Fraunces',serif;font-weight:800;color:var(--deep);letter-spacing:-.5px}
h1{font-size:clamp(28px,7vw,42px);margin-top:26px}
h2{font-size:clamp(26px,6vw,36px);margin-top:22px}
.script{font-family:'Caveat',cursive;font-weight:600;color:var(--ink);font-size:clamp(22px,5.2vw,30px);line-height:1.45;margin-top:12px}
.btn{
  margin-top:26px;border:0;cursor:pointer;color:#fff;font:700 17px 'Plus Jakarta Sans',sans-serif;
  padding:16px 34px;border-radius:999px;background:linear-gradient(180deg,var(--btn1),var(--btn2));
  box-shadow:0 12px 26px rgba(184,22,74,.35),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .2s,box-shadow .2s;animation:pulse 2.4s ease-in-out infinite;
}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 16px 30px rgba(184,22,74,.45)}
.btn:active{transform:scale(.96)}
@keyframes pulse{0%,100%{box-shadow:0 12px 26px rgba(184,22,74,.35)}50%{box-shadow:0 12px 36px rgba(224,54,107,.6)}}

/* intro envelope */
.env-icon{width:150px;height:150px;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 16px 20px rgba(194,24,91,.3))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}

/* slides */
.pic{
  width:min(62vw,270px);aspect-ratio:1;background:#fff;border-radius:28px;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 18px 40px rgba(194,24,91,.25);animation:pop .7s cubic-bezier(.2,1.4,.4,1);
}
.pic img,.pic svg{width:100%;height:100%;object-fit:cover}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.slide-emoji{font-size:30px;margin-top:10px;animation:float 2.6s ease-in-out infinite}
.dots{display:flex;gap:8px;margin-top:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:#e9a9bb;transition:.3s}
.dots i.on{background:var(--rose);width:22px;border-radius:8px}

/* sealed envelope */
.sealed-text{font-weight:600;font-size:clamp(16px,4vw,20px);color:var(--deep)}
.big-env{position:relative;width:min(80vw,340px);aspect-ratio:1.5;margin-top:26px;filter:drop-shadow(0 22px 28px rgba(150,90,0,.3));animation:float 3.4s ease-in-out infinite}
.big-env .body{position:absolute;inset:0;border-radius:16px;background:linear-gradient(160deg,#f9d34a,#eab72a);overflow:hidden}
.big-env .body::before,.big-env .body::after{content:"";position:absolute;bottom:0;width:60%;height:100%;background:rgba(0,0,0,.06)}
.big-env .body::before{left:0;clip-path:polygon(0 0,0 100%,100% 100%)}
.big-env .body::after{right:0;clip-path:polygon(100% 0,0 100%,100% 100%)}
.big-env .flap{position:absolute;top:0;left:0;right:0;height:58%;background:linear-gradient(180deg,#f6cb3c,#e8b625);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:16px 16px 0 0;transform-origin:top;transition:transform .8s ease;z-index:2}
.big-env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e53935,#a50f1f);color:#fff;font:800 22px 'Fraunces',serif;display:grid;place-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,.3);transition:opacity .4s,transform .5s}
.big-env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
.soft-btn{background:rgba(255,255,255,.55);color:var(--rose);box-shadow:none;animation:none;border:1px solid rgba(194,24,91,.2)}

/* letter */
.letter{
  width:100%;max-width:640px;background:var(--card);border-radius:26px;padding:26px 26px 22px;text-align:left;
  box-shadow:0 24px 50px rgba(194,24,91,.22);min-height:150px;
}
.letter h3{font-family:'Fraunces',serif;font-size:26px;color:var(--deep)}
.letter .status{font-style:italic;color:#a8325a;margin-top:8px;font-size:15px}
.letter .body{font-family:'Caveat',cursive;font-weight:500;font-size:clamp(23px,5.2vw,29px);line-height:1.5;white-space:pre-wrap;margin-top:10px}
.letter .sig{font-family:'Caveat',cursive;font-size:32px;text-align:right;margin-top:8px;opacity:0;transition:opacity 1s}
.letter .sig.show{opacity:1}
.caret::after{content:"|";animation:blink 1s steps(1) infinite;color:var(--rose)}
@keyframes blink{50%{opacity:0}}
#toGallery{opacity:0;pointer-events:none;transition:opacity .8s}
#toGallery.show{opacity:1;pointer-events:auto}

/* gallery */
#gallery .inner{max-width:1100px}
.carousel-wrap{position:relative;width:100%;margin-top:26px}
.carousel{
  display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 8vw 34px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;
}
.carousel::-webkit-scrollbar{display:none}
.carousel.drag{cursor:grabbing;scroll-snap-type:none}
.polaroid{
  flex:0 0 auto;width:min(66vw,250px);aspect-ratio:3/4.3;background:#fff;border-radius:18px;padding:10px 10px 10px;
  box-shadow:0 18px 34px rgba(194,24,91,.25);scroll-snap-align:center;transition:transform .35s;position:relative;
}
.polaroid:nth-child(odd){transform:rotate(-3deg)}
.polaroid:nth-child(even){transform:rotate(3deg) translateY(10px)}
.polaroid:hover{transform:rotate(0) scale(1.04)}
.polaroid .ph{width:100%;height:100%;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#ffe3ea,#ffc9d8);display:grid;place-items:center;position:relative}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;color:var(--rose);font-size:14px;cursor:pointer;padding:12px}
.empty b{font-size:40px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:var(--rose);font-size:22px;cursor:pointer;box-shadow:0 8px 18px rgba(194,24,91,.25);z-index:3;display:none}
.arrow.l{left:12px}.arrow.r{right:12px}
@media(hover:hover) and (min-width:760px){.arrow{display:block}}
.hint{font-size:14px;font-weight:600;color:var(--rose);display:flex;gap:12px;align-items:center;justify-content:center}
.hint .dots{margin:0}
.again{margin-top:14px;padding:12px 26px;font-size:15px;animation:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="floaters"></div>
<canvas id="confetti"></canvas>

<!-- 1. INTRO -->
<section class="screen active" id="intro">
  <div class="inner">
    <svg class="env-icon" viewBox="0 0 120 120">
      <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6e6e8"/></linearGradient></defs>
      <path d="M12 44 L60 8 L108 44 V100 a8 8 0 0 1 -8 8 H20 a8 8 0 0 1 -8 -8Z" fill="#f3f3f4"/>
      <path d="M12 100 L60 64 L108 100 a8 8 0 0 1 -8 8 H20 a8 8 0 0 1 -8 -8Z" fill="url(#eg)"/>
      <path d="M60 58 C40 40 38 24 50 20 C56 18 60 24 60 24 C60 24 64 18 70 20 C82 24 80 40 60 58Z" fill="#f0332f"/>
    </svg>
    <h1>Sofia... This Is For You 💫</h1>
    <p class="script">I didn't want to say.<br>So I put my thoughts into words. 🧡</p>
    <button class="btn" id="startBtn">Read My Message 💌</button>
  </div>
</section>

<!-- 2. SLIDES -->
<section class="screen" id="slides">
  <div class="inner">
    <div class="pic" id="slidePic"></div>
    <h2 id="slideTitle"></h2>
    <p class="script" id="slideText"></p>
    <div class="slide-emoji" id="slideEmoji"></div>
    <div class="dots" id="slideDots"></div>
    <button class="btn" id="nextBtn">Next →</button>
  </div>
</section>

<!-- 3. SEALED -->
<section class="screen" id="sealed">
  <div class="inner">
    <p class="sealed-text">I wanted to say this the right way, here it goes...</p>
    <div class="big-env" id="bigEnv">
      <div class="body"></div><div class="flap"></div><div class="seal">S</div>
    </div>
    <button class="btn soft-btn" id="unsealBtn">Unseal it 💗</button>
  </div>
</section>

<!-- 4. LETTER -->
<section class="screen" id="letterScreen">
  <div class="inner">
    <div class="letter">
      <h3>Hi Sofia, 💗</h3>
      <p class="status" id="status">Zaid is choosing every word carefully ✍️</p>
      <div class="body caret" id="letterBody"></div>
      <div class="sig" id="sig">– Zaid 💗</div>
    </div>
    <button class="btn" id="toGallery">One last surprise 🎁</button>
  </div>
</section>

<!-- 5. GALLERY -->
<section class="screen" id="gallery">
  <div class="inner">
    <h2 style="margin-top:0">You mean the world to me 💗</h2>
    <p class="script" style="font-size:22px;margin-top:6px">Made with love — Zaid</p>
    <div class="carousel-wrap">
      <button class="arrow l" id="prev" aria-label="Previous">‹</button>
      <div class="carousel" id="carousel"></div>
      <button class="arrow r" id="next" aria-label="Next">›</button>
    </div>
    <div class="hint"><div class="dots" id="gDots"></div><span>Swipe to see more</span></div>
    <button class="btn soft-btn again" id="replay">Read again 🔁</button>
  </div>
</section>

<script>
/* ======================================================
   ✏️  EDIT HERE — your names, words and photos
   ====================================================== */
const PHOTOS = [
  // Put your pictures in a folder called "photos" next to this file,
  // then list them here. Add or remove lines freely.
  "/photos/1.jpg",
  "/photos/2.jpg",
  "/photos/3.jpg",
  "/photos/4.jpg",
  "/photos/5.jpg"
];

const SLIDES = [
  { title:"I will start with this", text:"Baby, I wish I could hug you right now. 🥺", emoji:"❤️", art:"couple" },
  { title:"You Mean Everything", text:" meri jaan. You deserve all the love.", emoji:"🫶💖", art:"bears" },
  { title:"Straight From the Heart", text:"Even on your hardest and happy days, you'll always be my favourite person 💌🫶", emoji:"", art:"hearts" }
];

const LETTER =
`To my baby girl 💗🎀

I wish I could be there to hug you, pamper you. 🥺❤️ meri jaan, and remember you don't have to go through everything alone.

Sending you endless hugs, kisses, and all my love. 🫶💌

Love you always, my princess. 💗`;
/* ====================================================== */

const $ = id => document.getElementById(id);
const screens = document.querySelectorAll('.screen');
function show(id){ screens.forEach(s=>s.classList.toggle('active',s.id===id)); }

/* floating hearts */
const EMOJIS=['💗','💖','💕','🩷','🥰','💌','✨','🌸'];
function spawn(){
  const f=document.createElement('div'); f.className='floater';
  f.textContent=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  f.style.left=Math.random()*100+'vw';
  f.style.fontSize=(16+Math.random()*22)+'px';
  const d=7+Math.random()*7; f.style.animationDuration=d+'s';
  $('floaters').appendChild(f); setTimeout(()=>f.remove(),d*1000);
}
setInterval(spawn,700); for(let i=0;i<6;i++)setTimeout(spawn,i*250);

/* cute original illustrations */
const face=(cx,cy,r,fill,ear)=>`
  ${ear?`<circle cx="${cx-r*.7}" cy="${cy-r*.8}" r="${r*.32}" fill="${fill}"/><circle cx="${cx+r*.7}" cy="${cy-r*.8}" r="${r*.32}" fill="${fill}"/>`:''}
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/>
  <circle cx="${cx-r*.38}" cy="${cy-r*.05}" r="${r*.09}" fill="#4a2020"/>
  <circle cx="${cx+r*.38}" cy="${cy-r*.05}" r="${r*.09}" fill="#4a2020"/>
  <ellipse cx="${cx-r*.6}" cy="${cy+r*.22}" rx="${r*.17}" ry="${r*.11}" fill="#ff9db4" opacity=".8"/>
  <ellipse cx="${cx+r*.6}" cy="${cy+r*.22}" rx="${r*.17}" ry="${r*.11}" fill="#ff9db4" opacity=".8"/>
  <path d="M${cx-r*.14} ${cy+r*.2} Q${cx} ${cy+r*.38} ${cx+r*.14} ${cy+r*.2}" stroke="#4a2020" stroke-width="${r*.06}" fill="none" stroke-linecap="round"/>`;
const heart=(x,y,s,c='#f0446f')=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 8 C-14 -4 -6 -16 0 -8 C6 -16 14 -4 0 8Z" fill="${c}"/>`;
const ART={
  couple:`<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#fff"/>
    <ellipse cx="100" cy="182" rx="62" ry="10" fill="#fde1e8"/>
    <rect x="48" y="112" width="60" height="70" rx="28" fill="#f0e4cf"/><rect x="96" y="112" width="58" height="70" rx="28" fill="#ffd966"/>
    ${face(78,90,32,'#ffdcbf',false)}<path d="M52 72 Q78 40 104 72 Q92 58 78 58 Q64 58 52 72Z" fill="#3a2a22"/>
    ${face(126,92,30,'#ffdcbf',false)}<path d="M98 76 Q126 42 154 76 L154 108 Q150 80 126 76 Q104 80 98 108Z" fill="#2a1d1a"/>
    ${heart(100,40,1.4)}${heart(148,38,.9,'#ff8fab')}${heart(52,48,.9,'#ff8fab')}</svg>`,
  bears:`<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#fff"/>
    <ellipse cx="100" cy="182" rx="66" ry="9" fill="#fde1e8"/>
    <ellipse cx="68" cy="150" rx="30" ry="30" fill="#fff" stroke="#f1d3da" stroke-width="3"/>
    ${face(68,100,36,'#fff',true).replace(/fill="#fff"\/>/g,'fill="#fff" stroke="#f1d3da" stroke-width="3"/>')}
    <ellipse cx="136" cy="152" rx="30" ry="30" fill="#c98d5e"/>
    ${face(136,106,34,'#c98d5e',true)}
    ${heart(100,60,1.6)}${heart(102,34,.8,'#ff8fab')}</svg>`,
  hearts:`<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#fff"/>
    <ellipse cx="100" cy="180" rx="50" ry="8" fill="#fde1e8"/>
    <ellipse cx="100" cy="148" rx="38" ry="36" fill="#a8693e"/>
    <path d="M48 120 Q40 150 66 150" stroke="#a8693e" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M152 120 Q160 150 134 150" stroke="#a8693e" stroke-width="14" stroke-linecap="round" fill="none"/>
    ${face(100,92,38,'#a8693e',true)}
    ${heart(40,60,1.4)}${heart(160,56,1.6)}${heart(28,110,1)}${heart(172,108,1.1,'#ff8fab')}${heart(100,26,1.1,'#ff8fab')}${heart(60,28,.8)}</svg>`
};

/* slides */
let si=0;
function renderSlide(){
  const s=SLIDES[si];
  const pic=$('slidePic'); pic.style.animation='none'; void pic.offsetWidth; pic.style.animation='';
  pic.innerHTML = s.img ? `<img src="${s.img}" alt="">` : ART[s.art];
  $('slideTitle').textContent=s.title; $('slideText').textContent=s.text; $('slideEmoji').textContent=s.emoji||'';
  $('slideDots').innerHTML=SLIDES.map((_,i)=>`<i class="${i===si?'on':''}"></i>`).join('');
  $('nextBtn').textContent = si===SLIDES.length-1 ? 'Open my letter 💌' : 'Next →';
}
$('startBtn').onclick=()=>{si=0;renderSlide();show('slides');};
$('nextBtn').onclick=()=>{
  if(si<SLIDES.length-1){si++;renderSlide();} else {$('bigEnv').classList.remove('open');show('sealed');}
};

/* sealed → letter */
$('unsealBtn').onclick=()=>{
  $('bigEnv').classList.add('open');
  setTimeout(()=>{show('letterScreen');typeLetter();},1100);
};

let typing=0;
async function typeLetter(){
  const id=++typing, body=$('letterBody'), sig=$('sig'), btn=$('toGallery');
  body.textContent=''; sig.classList.remove('show'); btn.classList.remove('show');
  $('status').style.display='block'; body.classList.add('caret');
  await new Promise(r=>setTimeout(r,2200)); if(id!==typing)return;
  $('status').style.display='none';
  for(const ch of Array.from(LETTER)){
    if(id!==typing)return;
    body.textContent+=ch;
    await new Promise(r=>setTimeout(r,ch==='\n'?260:ch===','||ch==='.'?160:45));
  }
  body.classList.remove('caret'); sig.classList.add('show');
  setTimeout(()=>btn.classList.add('show'),900);
}
$('toGallery').onclick=()=>{show('gallery');buildGallery();setTimeout(confetti,500);};

/* gallery */
function buildGallery(){
  const c=$('carousel'); c.innerHTML='';
  PHOTOS.forEach((src,i)=>{
    const p=document.createElement('div'); p.className='polaroid';
    const ph=document.createElement('div'); ph.className='ph';
    const img=new Image(); img.alt='Our memory '+(i+1); img.draggable=false;
    img.onload=()=>{ph.innerHTML='';ph.appendChild(img)};
    img.onerror=()=>placeholder(ph,i);
    placeholder(ph,i,true); img.src=src;
    p.appendChild(ph); c.appendChild(p);
  });
  $('gDots').innerHTML=PHOTOS.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('');
  c.scrollLeft=0;
}
function placeholder(ph,i,loading){
  if(loading){ph.innerHTML='<div class="empty"><b>💗</b></div>';return;}
  ph.innerHTML='<label class="empty"><b>📷</b>Tap to add photo '+(i+1)+'<input type="file" accept="image/*" hidden></label>';
  ph.querySelector('input').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const im=new Image(); im.src=URL.createObjectURL(f); ph.innerHTML=''; ph.appendChild(im);
  };
}
const car=$('carousel');
car.addEventListener('scroll',()=>{
  const cards=[...car.children]; const mid=car.scrollLeft+car.clientWidth/2;
  let best=0,bd=1e9; cards.forEach((el,i)=>{const d=Math.abs(el.offsetLeft+el.offsetWidth/2-mid); if(d<bd){bd=d;best=i}});
  [...$('gDots').children].forEach((d,i)=>d.classList.toggle('on',i===best));
});
const step=()=>(car.children[0]?.offsetWidth||250)+22;
$('prev').onclick=()=>car.scrollBy({left:-step(),behavior:'smooth'});
$('next').onclick=()=>car.scrollBy({left:step(),behavior:'smooth'});
/* mouse drag for PC */
let down=false,sx=0,sl=0;
car.addEventListener('mousedown',e=>{down=true;sx=e.pageX;sl=car.scrollLeft;car.classList.add('drag')});
window.addEventListener('mouseup',()=>{down=false;car.classList.remove('drag')});
window.addEventListener('mousemove',e=>{if(down){car.scrollLeft=sl-(e.pageX-sx)}});

$('replay').onclick=()=>{show('intro');};

/* confetti */
function confetti(){
  const cv=$('confetti'),ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#ff4d79','#ffb3c6','#ffd166','#c77dff','#ff8fab','#ffffff'];
  const ps=Array.from({length:150},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:6+Math.random()*7,h:8+Math.random()*8,
    vx:-1.5+Math.random()*3,vy:2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(++t<260)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
</script>
</body>
</html>
